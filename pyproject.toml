[project]
name = "file-mcp"
version = "1.0.0"
description = "MCP service for passing large files through object storage, behind Keystone."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1,<5",
    "boto3>=1.35",
    "pyjwt>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[s3]>=5",
    "pyyaml>=6",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/file_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/file_mcp" = "file_mcp"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = ["src/file_mcp/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["file_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "integration: Docker-backed checks filled in by later cards",
]
filterwarnings = ["error::fastmcp._warnings.FastMCPDeprecationWarning"]
