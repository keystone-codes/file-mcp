name: Tag release

on:
  push:
    branches: [main]
    paths:
      - keystone-service.yaml

permissions:
  contents: write
  packages: read

jobs:
  tag:
    name: Tag the pinned digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read version and digest
        id: pin
        run: python3 scripts/read_image_pin.py >> "$GITHUB_OUTPUT"

      - name: Stop when the tag already exists
        id: exists
        env:
          RELEASE_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -eu
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "tag v${RELEASE_VERSION} already exists"
          elif [ "$code" -eq 2 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "git ls-remote failed"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.exists.outputs.present == 'false'

      - name: Log in to GHCR
        if: steps.exists.outputs.present == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require the published digest to match
        if: steps.exists.outputs.present == 'false'
        env:
          RELEASE_VERSION: ${{ steps.pin.outputs.version }}
          IMAGE_DIGEST: ${{ steps.pin.outputs.digest }}
        run: |
          set -eu
          published="$(docker buildx imagetools inspect "ghcr.io/keystone-codes/file-mcp:${RELEASE_VERSION}" --format '{{json .Manifest.Digest}}')"
          published="${published#\"}"
          published="${published%\"}"
          if [ "$published" != "$IMAGE_DIGEST" ]; then
            echo "published digest does not match keystone-service.yaml; refusing to tag"
            exit 1
          fi

      - name: Tag and publish the GitHub release
        if: steps.exists.outputs.present == 'false'
        env:
          RELEASE_VERSION: ${{ steps.pin.outputs.version }}
          IMAGE_DIGEST: ${{ steps.pin.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="v${RELEASE_VERSION}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" \
            --title "$tag" \
            --notes "Image: ghcr.io/keystone-codes/file-mcp@${IMAGE_DIGEST} (linux/amd64, linux/arm64)"
